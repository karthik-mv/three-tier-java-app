name: Three-Tier-App

# ============================================================
# TRIGGERS
# ============================================================
on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL PERMISSIONS
# ============================================================
permissions:
  id-token: write
  contents: read


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================
env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: three-tier-java-app
  EKS_CLUSTER_NAME: my-cluster
  IMAGE_TAG: ${{ github.sha }}


# ============================================================
# JOBS
# ============================================================
jobs:

  # ==========================================================
  # 1. BUILD + TEST
  # ==========================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Java 17
      # --------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # --------------------------------------------------------
      # Build application and run tests
      # --------------------------------------------------------
      - name: Build application
        run: |
          mvn clean package -DskipTests=false


      # --------------------------------------------------------
      # Verify WAR file
      # --------------------------------------------------------
      - name: Verify WAR file
        run: |
          echo "Contents of target directory:"
          ls -lh target/

          echo "Searching for WAR file:"
          find target -name "*.war"

          if ! find target -name "*.war" | grep -q ".war"; then
            echo "ERROR: WAR file was not generated"
            exit 1
          fi

          echo "WAR file generated successfully"


      # --------------------------------------------------------
      # Upload WAR artifact
      # --------------------------------------------------------
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war


  # ==========================================================
  # 2. SONARQUBE ANALYSIS
  # ==========================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Setup Java 17
      # --------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # --------------------------------------------------------
      # SonarQube scan
      # --------------------------------------------------------
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=three-tier-java-app \
            -Dsonar.projectName=three-tier-java-app \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"


  # ==========================================================
  # 3. DOCKER BUILD + ECR PUSH
  # ==========================================================
  docker:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    needs:
      - build
      - sonarqube

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Debug GitHub context
      # --------------------------------------------------------
      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit SHA: ${{ github.sha }}"


      # --------------------------------------------------------
      # DEBUG OIDC TOKEN
      #
      # TEMPORARY:
      # Keep this until AWS OIDC authentication works.
      # --------------------------------------------------------
      - name: Debug OIDC token
        uses: github/actions-oidc-debugger@main


      # --------------------------------------------------------
      # AWS authentication using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 1


      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

